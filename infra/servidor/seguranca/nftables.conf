#!/usr/sbin/nft -f
# NOC SENAI: firewall do servidor. Entrada só do necessário, vinda das redes do projeto; saída livre.
#
# Fase 1 (monitoramento): counter noc_drop_input conta o que seria descartado (Zabbix: noc.srv[nft_drops]).
# Fase 2 (blindagem): limite de SYN e de conexões simultâneas por IP de origem na porta do site (80/443),
#                     para que um flood de um único cliente não sature o Apache.
#
# Recarga ATÔMICA só desta tabela (não usa "flush ruleset"): preserva a tabela do fail2ban,
# que vive numa tabela própria e mantém os IPs banidos mesmo quando este arquivo é recarregado.
table inet filter
delete table inet filter
table inet filter {
  set lan_projeto { type ipv4_addr; flags interval; elements = { 192.168.10.0/24, 192.168.20.0/24 } }
  set gerencia    { type ipv4_addr; flags interval; elements = { 192.168.10.0/24, 172.16.0.0/12 } }
  # Contador do que é descartado (monitoramento, Fase 1): só conta, não muda o que é aceito.
  counter noc_drop_input { }
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp } accept
    ip saddr @gerencia tcp dport 22 accept

    # --- Blindagem da camada web (Fase 2): por IP de origem, apenas no site (80/443) ---
    # Mais de 60 conexões novas por segundo de um mesmo IP = flood: descarta o excesso (e conta).
    tcp dport { 80, 443 } ct state new meter noc_web_syn { ip saddr limit rate over 60/second burst 120 packets } counter name noc_drop_input drop
    # Mais de 100 conexões simultâneas de um mesmo IP no site = flood: descarta o excesso (e conta).
    tcp dport { 80, 443 } meter noc_web_conn { ip saddr ct count over 100 } counter name noc_drop_input drop

    # Tráfego legítimo do site e do Grafana, vindo das redes do projeto.
    ip saddr @lan_projeto tcp dport { 80, 443, 3000 } accept
    ip6 saddr fe80::/10 udp dport 546 accept
    counter name noc_drop_input    # conta tudo que chegou até aqui (será descartado pela policy)
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output priority 0; policy accept; }
}
