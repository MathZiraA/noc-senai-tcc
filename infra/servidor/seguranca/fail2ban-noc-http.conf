# NOC SENAI — jail do fail2ban contra flood HTTP (Fase 2): bane no firewall o IP que ultrapassa
# o limite de requisições por segundo, de forma persistente (o mod_evasive corta por 30 s; a jail
# mantém o IP banido por 10 min). Instalar em /etc/fail2ban/jail.d/noc-http.conf e: systemctl restart fail2ban
#
# 400 requisições em 20 s do mesmo IP (= 20 req/s sustentado) dispara o banimento.
# O painel do SennaGuard atualiza bem abaixo disso, então um operador legítimo não é banido.
[noc-http-flood]
enabled   = true
filter    = noc-http-flood
logpath   = /var/log/apache2/*access.log
maxretry  = 400
findtime  = 20
bantime   = 10m
action    = nftables-multiport[name=noc-http, port="http,https", protocol=tcp]
