# NOC SENAI — mod_evasive (Fase 2): corta na camada de aplicação um cliente que dispara requisições
# rápidas demais, antes de saturar os workers do Apache. Instalar em /etc/apache2/conf-available/noc-evasive.conf
# e habilitar: a2enmod evasive && a2enconf noc-evasive && systemctl reload apache2
#
# DOSPageCount: máx. de requisições à MESMA página por intervalo, por IP.
# DOSSiteCount: máx. de requisições ao site inteiro por intervalo, por IP.
# DOSBlockingPeriod: segundos que o IP fica bloqueado (403) ao estourar.
<IfModule mod_evasive20.c>
    DOSHashTableSize 3097
    DOSPageCount 25
    DOSSiteCount 150
    DOSPageInterval 1
    DOSSiteInterval 1
    DOSBlockingPeriod 30
    DOSLogDir "/var/log/mod_evasive"
</IfModule>
