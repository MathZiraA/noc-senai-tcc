# NOC SENAI — filtro do fail2ban: conta requisições HTTP por IP de origem no log do Apache.
# Instalar em /etc/fail2ban/filter.d/noc-http-flood.conf
#
# Casa os dois formatos: o padrão (IP no início) e o "vhost_combined" do other_vhosts_access.log,
# cujas linhas começam com "vhost:porta IP_cliente - - [data] ...".
[Definition]
failregex = ^<HOST> -\s
            ^\S+ <HOST> -\s
ignoreregex =
