# NOC SENAI — métricas de segurança do servidor para o zabbix-agent2.
# Instalar em /etc/zabbix/zabbix_agent2.d/noc.conf e reiniciar: systemctl restart zabbix-agent2
#
# Uma única chave parametrizada chama o coletor; o item escolhe a métrica pelo argumento.
# Ex. de chaves no Zabbix: noc.srv[synrecv], noc.srv[http], noc.srv[apache_busy], noc.srv[fail2ban].
UserParameter=noc.srv[*],/usr/local/bin/noc-metricas.sh "$1"
