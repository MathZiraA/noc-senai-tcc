# NOC SENAI — liga o mod_status do Apache só para o próprio servidor (127.0.0.1).
# O coletor lê https://127.0.0.1/server-status?auto para contar os workers ocupados (saturação = ataque).
# Instalar em /etc/apache2/conf-available/noc-status.conf e habilitar:
#   a2enmod status && a2enconf noc-status && systemctl reload apache2
<IfModule mod_status.c>
    ExtendedStatus On
    <Location /server-status>
        SetHandler server-status
        Require local
    </Location>
</IfModule>
